Case_IO:
  CaseA_path: IOfiles/IEEE13/case_A.json
  CaseA_format: PandaPower
  CaseB_path: IOfiles/IEEE13/case_B.mat
  CaseB_format: MATPOWER
  Output_path: IOfiles/IEEE13/Output

Tolerances:
  network:
    r_pu: 1e-6
    x_pu: 1e-6
    b_pu: 1e-6
    p_mw: 1e-6
    q_mvar: 1e-6
  op_state:
    v_mag_pu: 1e-6
    v_ang: 1e-6
    p_mw: 1e-6
    q_mvar: 1e-6
    s_mva: 1e-6

Preferences:
  export_canonical_format: False
  enable_multithreading: True
  enable_multiprocessing: True

Termination_clauses:
  abort_if_network_mismatch: True
  abort_at_first_mismatch: False
