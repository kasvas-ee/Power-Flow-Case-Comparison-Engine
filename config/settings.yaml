Case_IO:
  CaseA_path: IOfiles/IEEE14bus/Inputs/case_A.mat
  CaseA_format: MATPOWER
  CaseB_path: IOfiles/IEEE14bus/Inputs/case_B.json
  CaseB_format: PandaPower
  Output_path: IOfiles/IEEE14bus/Outputs

Report:
  y_pu_tolerance: 1e-6  # Tolerance for Ybus Admittance in p.u.
  top_n_severe: 10      # If mismatch exceed sever threshold, display these many highest mismatches.

Preferences:
  export_canonical_format: True
  report_all_mismatches: False
  generate_side-by-side_comparator: True
  enable_multithreading: True
  enable_multiprocessing: False

Termination_clauses:
  abort_if_network_mismatch: True
  abort_at_first_mismatch: False

# Optional, fully local open-weight AI diagnostic report.
# Start a local vLLM server before enabling this setting.
AI_Insights:
  enabled: False
  base_url: "http://localhost:8000/v1"
  model: "Qwen/Qwen3-14B"
  timeout_seconds: 180
  max_tokens: 2200
